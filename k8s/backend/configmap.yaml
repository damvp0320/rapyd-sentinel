apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-nginx
  namespace: sentinel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: rapyd-sentinel
data:
  default.conf: |
    server {
      listen 80;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        default_type text/plain;
        return 200 "Hello from backend\n";
      }
    }
