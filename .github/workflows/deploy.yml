name: deploy

# Plan on every push; apply only on main, using exactly the plan that was reviewed in the plan job.
# AWS access is keyless: the job assumes the sentinel-damian-gha role through GitHub OIDC.
on:
  push:

permissions:
  id-token: write # request the OIDC token
  contents: read

# Never cancel a run in progress: stopping an apply halfway can leave infrastructure half built.
concurrency:
  group: deploy-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: 1.10.5
  TF_DIR: terraform/envs/poc

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"

      - name: terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan

      - name: Show plan in job summary
        run: |
          {
            echo '### terraform plan'
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 3

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"

      - name: terraform apply (the saved plan)
        run: terraform -chdir="$TF_DIR" apply -input=false tfplan

      - name: Outputs
        run: |
          {
            echo '### terraform outputs'
            echo '```'
            terraform -chdir="$TF_DIR" output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
