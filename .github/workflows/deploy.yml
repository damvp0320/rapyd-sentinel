name: deploy

# Plan on every push; apply only on main, using exactly the plan that was reviewed in the plan job.
# AWS access is keyless (GitHub OIDC) and each stage uses its own least-privilege role:
#   plan, e2e-test   sentinel-damian-gha-read    read-only, any branch
#   apply            sentinel-damian-gha-apply   write, only from the "production" environment (main)
#   deploy-*         sentinel-damian-gha-deploy  describe cluster + Kubernetes admin, only from "production" (main)
on:
  push:
    paths-ignore:
      - 'assets/**'
      - '*.md'
  # Manual run from the Actions tab (on main it also applies and deploys), no commit needed.
  workflow_dispatch:

permissions:
  id-token: write # request the OIDC token
  contents: read

# Never cancel a run in progress: stopping an apply halfway can leave infrastructure half built.
concurrency:
  group: deploy-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: 1.10.5
  TF_DIR: infra/envs/poc
  BACKEND_CLUSTER: eks-backend
  GATEWAY_CLUSTER: eks-gateway

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_READ_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"

      - name: terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan

      - name: Show plan in job summary
        run: |
          {
            echo '### terraform plan'
            echo '```'
            terraform -chdir="$TF_DIR" show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 3

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}"

      - name: terraform apply (the saved plan)
        run: terraform -chdir="$TF_DIR" apply -input=false tfplan

      - name: Outputs
        run: |
          {
            echo '### terraform outputs'
            echo '```'
            terraform -chdir="$TF_DIR" output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Workloads. Order matters: the gateway config needs the backend's NLB hostname.
  # -------------------------------------------------------------------------
  deploy-backend:
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend_host: ${{ steps.lb.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for eks-backend
        run: aws eks update-kubeconfig --name "$BACKEND_CLUSTER"

      - name: Validate backend manifests (server-side dry run)
        run: |
          kubectl apply -f k8s/backend/namespace.yaml
          kubectl apply --dry-run=server -f k8s/backend/

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/backend/
          kubectl -n sentinel rollout status deployment/backend --timeout=300s

      - name: Wait for the internal NLB hostname
        id: lb
        run: |
          for i in $(seq 1 60); do
            host=$(kubectl -n sentinel get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && break
            sleep 10
          done
          test -n "$host" || { echo "backend NLB hostname not assigned"; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "### Backend internal NLB: \`$host\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-gateway:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    outputs:
      gateway_host: ${{ steps.lb.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl for eks-gateway
        run: aws eks update-kubeconfig --name "$GATEWAY_CLUSTER"

      - name: Render manifests with the backend NLB hostname
        run: ./scripts/render-gateway.sh "${{ needs.deploy-backend.outputs.backend_host }}" rendered/gateway

      - name: Validate gateway manifests (server-side dry run)
        run: |
          kubectl apply -f rendered/gateway/namespace.yaml
          kubectl apply --dry-run=server -f rendered/gateway/

      - name: Deploy gateway
        run: |
          kubectl apply -f rendered/gateway/
          kubectl -n sentinel rollout status deployment/gateway --timeout=300s

      - name: Wait for the public NLB hostname
        id: lb
        run: |
          for i in $(seq 1 60); do
            host=$(kubectl -n sentinel get svc gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && break
            sleep 10
          done
          test -n "$host" || { echo "gateway NLB hostname not assigned"; exit 1; }
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "### Public gateway NLB: \`$host\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Proof that the whole chain works and that the backend is private.
  # -------------------------------------------------------------------------
  e2e-test:
    needs: [deploy-backend, deploy-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_READ_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # A new NLB can take a few minutes to start serving, so retry for up to 10 minutes.
      - name: Request through the public gateway reaches the backend
        env:
          GATEWAY_HOST: ${{ needs.deploy-gateway.outputs.gateway_host }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s -m 10 "http://$GATEWAY_HOST/" || true)
            echo "attempt $i: '${body}'"
            [ "$body" = "Hello from backend" ] && break
            sleep 15
          done
          [ "$body" = "Hello from backend" ] || { echo "gateway did not return the backend response"; exit 1; }
          {
            echo '### End-to-end test'
            echo "\`curl http://$GATEWAY_HOST/\` returned \`$body\` (client, public NLB, NGINX, VPC peering, internal NLB, backend pod)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Backend is private (exposure checks)
        run: |
          {
            echo '### Exposure checks'
            echo '```'
            ./scripts/verify-exposure.sh "${{ needs.deploy-backend.outputs.backend_host }}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/verify-exposure.sh "${{ needs.deploy-backend.outputs.backend_host }}" > /dev/null
