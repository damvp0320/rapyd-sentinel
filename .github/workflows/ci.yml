name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: terraform-linters/setup-tflint@v4
      - name: terraform fmt
        run: |
          if find terraform -name '*.tf' 2>/dev/null | grep -q .; then terraform fmt -check -recursive terraform; else echo "no terraform yet"; fi
      - name: terraform validate (every module and root)
        run: |
          for d in $(find terraform -name '*.tf' -exec dirname {} \; 2>/dev/null | sort -u); do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - name: tflint
        run: |
          for d in $(find terraform -name '*.tf' -exec dirname {} \; 2>/dev/null | sort -u); do
            echo "::group::tflint $d"
            tflint --chdir="$d"
            echo "::endgroup::"
          done
