name: ci

# Static checks on every push and pull request. No AWS credentials are needed here.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: terraform-linters/setup-tflint@v4

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate (every module and root)
        run: |
          for d in $(find terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - name: tflint (recommended preset, see .tflint.hcl)
        run: |
          for d in $(find terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::tflint $d"
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir="$d"
            echo "::endgroup::"
          done
